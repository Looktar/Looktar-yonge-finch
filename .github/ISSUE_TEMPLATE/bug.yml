name: 问题 / Bug
description: 画面不对、报错、卡顿、操作有问题
labels: [bug]
body:
  - type: input
    id: device
    attributes:
      label: 设备和浏览器
      placeholder: 例如 iPhone 15 Pro / Safari，或 Windows / Chrome
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: 打开的链接和版本号
      description: 菜单底部的版本号（例如 v0.4.0），以及是 GitHub Pages 还是 claude.ai 链接
  - type: textarea
    id: what
    attributes:
      label: 发生了什么，本来应该是什么样
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: 截图（最好带 #debug）
      description: 在链接末尾加 #debug 再打开，截图里会有显卡、画质、曝光和报错列表
