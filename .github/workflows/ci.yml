name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # dist/index.html is committed: it must match what build.py makes from src/
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-screenshots
          path: test-results/smoke/
